[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-neural-networks"
version = "0.1.0"
description = "PyTorch neural network components for low-latency inference, reinforcement learning, and distillation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "why-so-ai-llc" }
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "scipy>=1.9",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pytorch_neural_networks*"]
